.people { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 250px), 1fr)); gap: 8px; }
.person {
  display: grid; grid-template-columns: 48px minmax(0, 1fr); column-gap: 12px; row-gap: 2px; align-items: center;

}

.person .rl, .person .tr { font: 400 12px/1.3 var(--font-pixel); color: var(--bone-dim); }
.person .tr b { color: var(--gold); font-weight: 500; }

.crew { display: grid; }
.mate { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 2px 12px; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--line-soft); }

  position: fixed; z-index: 40; left: 50%; top: calc(58px + env(safe-area-inset-top, 0px)); transform: translateX(-50%);
  width: max-content; max-width: min(92vw, 420px); padding: 10px 14px; pointer-events: none;

<body>
<div id="app">
  <div class="stage" id="stage">
    <canvas id="scene" role="img" aria-label="The harbour at Rhodes."></canvas>
    <div class="hotspots" id="hotspots"></div>
    <header class="hud" id="hud">
      <div class="hud-row">
        <div class="purse" id="purse"><img id="coinImg" alt="" width="22" height="22"><b id="silver">0</b><span class="unit">dr</span></div>
        <span class="hud-where" id="where"></span>
        <span class="spacer"></span>

// ---------- randomness: seeded, and stored in the save, so a game replays the same way ----------
function rnd(s) {
  s.seed = (s.seed + 0x6D2B79F5) | 0;
  let t = Math.imul(s.seed ^ (s.seed >>> 15), 1 | s.seed);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
const pick = (s, arr) => arr[Math.floor(rnd(s) * arr.length) % arr.length];

function newGame(seed) {
  const s = {
    v: VERSION, ch: 1, seed: (seed | 0) || 1, phase: 'title', started: false, hull: 'small',
    silver: OWN_SILVER + LOAN.principal, loan: { due: LOAN.due, paid: false, paidAmt: 0 }, debt: 0,
    items: [], nextId: 1,
    crew: CREW.map(c => Object.assign({}, c, { st: 'ok' })), lost: [],
    port: 'rhodes', home: false, visit: null, voyage: null, camp: null, dayN: 0, half: false,
    mk: {}, trades: {}, rep: { rhodes: 10, halic: 0 }, proxenos: {},
    fresh: 0, hungry: false, thirsty: false, pending: null, pirates: null, flags: {},
    stats: { broken: 0, bought: 0, sold: 0, spent: 0, earned: 0, hungry: 0, thirsty: 0, nights: 0, haggles: 0 },
    log: [], said: {}, summary: null,
  };
  addItem(s, 'barley', 'hold', 1, 6, 0);
  addItem(s, 'water', 'hold', 2, 6, 0);
  openVisit(s, 'rhodes');
  return s;
}

function begin(s) {
  if (s.started) return;
  s.started = true; s.phase = 'port';
  say(s, 'The harbour smelled of tar, fish and money. Ariston went to see what Halicarnassus might want.');
}

  const e = { text, tone: tone || '', when: whenLabel(s) };

  say(s, s.debt ? 'Ariston paid Antimachos what he had. The banker wrote the rest on a wax tablet. Ariston would see that tablet again.' : 'Ariston paid Antimachos his 195 drachmas. The banker counted them twice, and smiled once.');

// ---- at sea, at night, aboard ----
const voyageSig = () => { const v = S.voyage; return [v.day, v.wind, v.row, S.half, UI.speed, S.dayN, mouths(S), S.crew.map(c => c.st).join('')].join('|'); };

// ---- the story line under the purse ----
function pumpStory(now) {
  while (OUT.length) UI.queue.push(OUT.shift());
  if (UI.queue.length > 3) { const tag = UI.queue.some(e => e.tone === 'dolphins'); UI.queue.splice(0, UI.queue.length - 3); if (tag) UI.dolphins = 9; }
  if (!UI.queue.length || now - UI.shownAt < UI.holdFor) return;
  const e = UI.queue.shift();
  els.stripText.textContent = e.text;
  els.stripText.className = e.tone === 'bad' || e.tone === 'good' ? e.tone : '';
  void els.stripText.offsetWidth; els.stripText.classList.add('in');
  if (e.tone === 'dolphins') UI.dolphins = 9;
  UI.shownAt = now;
  UI.holdFor = clamp(1300 + e.text.length * 30, 2200, 5400) * (UI.queue.length > 1 ? 0.55 : 1) / (S.phase === 'sea' ? Math.max(1, UI.speed * DEV.speed * 0.8) : 1);
}
function banner(title, sub) { els.banner.innerHTML = esc(title) + (sub ? `<small>${esc(sub)}</small>` : ''); els.banner.classList.add('on'); UI.bannerT = 2.8; }
const phaseKey = () => [S.phase, S.port || '', S.camp ? S.camp.stop : '', S.dayN].join(':');
function onPhase() {
  const key = phaseKey();
  if (key === UI.lastWhere) return;
  const prev = UI.lastWhere;
  UI.lastWhere = key;
  if (!prev) return;
  els.banner.classList.remove('on'); UI.bannerT = 0;
  UI.queue = []; UI.shownAt = -1e9;
  if (S.phase === 'port') { banner(PORTS[S.port].name, S.home ? 'Home' : 'In port'); setTab('main'); Snd.arrive(); }
  else if (S.phase === 'camp') { banner(STOPS[S.camp.stop].name, 'Night'); setTab('main'); }
  else if (S.phase === 'sea' && prev.split(':')[0] !== 'sea') setTab('main');
  else if (S.phase === 'summary') { closeSheet(); showSummary(); }
  save();
}

// ---- the theatre: the title, the opening, and the end of the season ----

    row('Crew lost', m.lost.length ? m.lost.map(l => esc(l.name)).join(', ') : 'Nobody') + (m.friend ? row('A friend in Halicarnassus', esc(m.friend)) : '') +
    `<dt class="total">Profit</dt><dd class="total">${m.profit >= 0 ? '+' : ''}${m.profit} dr</dd></dl>` +
    `<p>${m.profit >= 40 ? 'Ariston slept for most of a day. Then he went back down to the harbour to ask what Miletus might want.' : m.profit >= 0 ? 'Ariston had his ship, his crew, and his name. In his trade, that is a beginning.' : 'Ariston went home and did sums on a wax tablet until the lamp ran out. Next season would have to be better.'}</p></div>`;
  els.tActions.innerHTML = '<button class="btn" type="button" data-t="log">Read the voyage again</button><button class="btn primary" type="button" data-t="again">Play Chapter I again</button>';
  els.tHint.textContent = 'Chapter II, the voyage to Miletus, is still being built.';
}
function showLog() {
  els.tText.innerHTML = '<ol class="log">' + S.log.filter(e => e.tone !== 'quiet' && e.tone !== 'choice').map(e => `<li><span class="when">${esc(e.when)}</span>${esc(e.text)}</li>`).join('') + '</ol>';
  els.tActions.innerHTML = '<button class="btn primary" type="button" data-t="back">Back</button>';
  els.tHint.textContent = '';
}
function freshGame() {
  S = newGame((Date.now() & 0x7fffffff) || 7);
  UI.queue = []; UI.lastWhere = phaseKey(); UI.tab = 'main'; UI.mounted = ''; UI.pirate = null; UI.silverShown = null;
  els.stripText.textContent = '';
  save();
}
function theaterAct(t, b) {
  if (t === 'begin') playIntro();
  else if (t === 'next') { TH.i = Math.min(INTRO.length - 1, TH.i + 1); introStep(); }
  else if (t === 'harbour') {
    begin(S); closeTheater(); UI.lastWhere = phaseKey(); setTab('main'); renderPanel(); Snd.mood('port'); save();
    setTimeout(() => { if (S.phase === 'port') tipOnce('quay', 'Tap a merchant on the quay, or in the picture, to trade.'); }, 900);
  } else if (t === 'continue') { closeTheater(); renderPanel(); }
  else if (t === 'new') { if (b.dataset.armed) { freshGame(); playIntro(); } else { b.dataset.armed = '1'; b.textContent = 'Tap again to start over'; } }
  else if (t === 'again') { freshGame(); playIntro(); }
  else if (t === 'log') showLog();
  else if (t === 'back') showSummary();
}

// ---- what the buttons do ----
function sellLines(r) { if (r.lines) for (const l of r.lines) say(S, l); return r.lines && r.lines.length ? r.lines.join(' ') : null; }
function doAct(act, b) {
  const m = b.dataset.m, g = b.dataset.g;
  switch (act) {
    case 'buy': {
      const r = buy(S, m, g);
      if (!r.ok) { Snd.nope(); toast(r.msg); break; }
      Snd.coin(); UI.reply = null; renderSheet();
      if (r.item.stowed) { delete r.item.stowed; toast('The quay was full, so the crew stowed it in the hold.'); }
      else tipOnce('dock', 'It is on the quay. Open the Hold to pack it into the ship.');
      break;
    }
    case 'sell': case 'sellall': {
      let got = 0, n = 0, text = null;
      do { const r = sell(S, m, g); if (!r.ok) { if (!n) { toast(r.msg); Snd.nope(); } break; } got += r.price; n++; text = sellLines(r) || text; } while (act === 'sellall' && countGood(S, g) > 0);
      if (n) { Snd.coins(); UI.reply = { text: text || `Sold ${n > 1 ? num(n) + ' for ' + got : 'for ' + got} dr.`, good: got > 0 }; renderSheet(); }
      break;
    }
    case 'haggle': { const r = haggle(S, m); if (r.ok) Snd.yes(); else Snd.no(); UI.reply = { text: r.line || r.msg, good: r.ok }; renderSheet(); break; }
    case 'refill': { const n = refill(S, 'all'); if (n) { Snd.splash(); toast(cap(num(n)) + ' water jar' + (n > 1 ? 's' : '') + ' filled.'); } renderSheet(); break; }
    case 'hire': {
      const h = b.dataset.hire, r = hire(S, h);
      if (!r.ok) { Snd.nope(); toast(r.msg); break; }
      Snd.coin(); UI.reply = { text: HIRES[h].joined, good: true }; renderSheet();
      tipOnce('kit', 'Their gear is on the quay. Pack it into the hold, or they stay ashore.');
      break;
    }
    case 'dismiss': dismiss(S, b.dataset.hire); closeSheet(); break;
    case 'sail': openSheet('sail'); break;
    case 'sail-yes': { const r = setSail(S); closeSheet(); if (!r.ok) toast(r.msg); else { Snd.mood('sea'); setTab('main'); } break; }
    case 'close': closeSheet(); break;
    case 'camp': { const r = campAct(S, b.dataset.id); if (!r.ok) { toast(r.msg); Snd.nope(); } else if (b.dataset.id === 'spring') Snd.splash(); else Snd.coin(); break; }
    case 'sleep': { const r = sleep(S, b.dataset.route); if (!r.ok) toast(r.msg); break; }
    case 'row': setRow(S, b.dataset.v === '1'); break;
    case 'half': setHalf(S, b.dataset.v === '1'); break;
    case 'speed': UI.speed = +b.dataset.v; break;
    case 'autopack': {
      const before = dockItems(S).length, n = autoPack(S), left = dockItems(S).length;
      if (n) Snd.place();
      HOLD.msg = left ? `The crew packed ${num(n)} of ${num(before)}. The rest would not fit. Sell something, or pack it more cleverly.` : 'The crew packed everything. It is not always the best way, but it is a way.';
      break;
    }
    case 'unpack': { unpackAll(S); Snd.place(); HOLD.msg = ''; break; }
    case 'choose': {
      const id = S.pending, title = EVENTS[id].title, c = b.dataset.c, lines = resolveEvent(S, c);
      if (!lines.length) break;
      if (c === 'fight') { if (hasBolt(S)) Snd.bolt(); Snd.clash(); if (UI.pirate) UI.pirate.fight = true; }
      else if (id === 'squall' && c === 'ride') Snd.splash();
      UI.outcome = { title, lines }; renderSheet(true); save();
      break;
    }
    case 'continue': UI.outcome = null; if (S.pending) renderSheet(true); else { closeSheet(); if (UI.pirate) UI.pirate.leaving = true; } break;
    case 'repay': { const r = repay(S); if (!r.ok) toast(r.msg); else { Snd.coins(); closeSheet(); } break; }
    case 'sound': toggleSound(); renderSheet(); break;
    case 'restart': if (UI.armed === 'restart') { closeSheet(); freshGame(); playIntro(); } else { UI.armed = 'restart'; renderSheet(); } break;
  }
  renderPanel(); updateHUD(); updateTabs();
  save();
}
function toggleSound() { Snd.setMuted(!Snd.muted); try { localStorage.setItem(SOUND_KEY, Snd.muted ? '1' : '0'); } catch (e) { /* ignore */ } paintSound(); }
function paintSound() { els.soundBtn.innerHTML = pxIcon(Snd.muted ? 'soundOff' : 'soundOn'); els.soundBtn.setAttribute('aria-pressed', String(!Snd.muted)); }
document.addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) {
    if (TH.mode === 'intro' && e.target.closest('#theater')) { Snd.init(); if (TH.i < INTRO.length - 1) { TH.i++; introStep(); } }
    else if (e.target === els.sheet && UI.sheet && UI.sheet.kind !== 'event') closeSheet();
    else if (e.target.closest('#strip')) setTab('ledger');
    return;
  }
  Snd.init();
  if (b.dataset.t) return theaterAct(b.dataset.t, b);
  if (b.dataset.tab) return setTab(b.dataset.tab);
  if (b.dataset.act) return doAct(b.dataset.act, b);
  if (b.id === 'menuBtn') return openSheet('menu');
  if (b.id === 'soundBtn') return toggleSound();
  if (b.dataset.m) return openSheet('merchant', b.dataset.m);
  if (b.dataset.hire) return openSheet('hire', b.dataset.hire);
});
els.strip.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); setTab('ledger'); } });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && UI.sheet && UI.sheet.kind !== 'event') closeSheet(); });
document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
window.addEventListener('pagehide', save);

// ---- the loop ----
function syncSpots(spots, fit, key) {
  if (UI.spotsKey === key) return;
  UI.spotsKey = key;
  els.hotspots.innerHTML = spots.map(sp => { const m = MERCHANTS[sp.id]; return `<button class="hotspot" type="button" data-m="${sp.id}" aria-label="${esc(m.name)}, ${esc(m.role)}" style="left:${Math.round(sp.x0 * fit.P - fit.ox)}px;top:${sp.y0 * fit.P}px;width:${(sp.x1 - sp.x0) * fit.P}px;height:${(sp.y1 - sp.y0) * fit.P}px"></button>`; }).join('');
}
function seaOpts() {
  const v = S.voyage, idx = Object.keys(DAYS).indexOf(v.day);
  return { clock: v.clock, storm: UI.storm, calm: v.wind === 'calm', row: v.row && !S.pending, crew: Math.min(8, S.crew.length), seed: 3 + idx * 5, scroll: idx * 700 + v.prog * 240, pirate: UI.pirate, dolphins: UI.dolphins };
}
function drawMain(t) {
  const fit = fitPixels(els.scene, els.stage.clientWidth, els.stage.clientHeight, 140);
  G = els.scene.getContext('2d'); G.imageSmoothingEnabled = false;
  if (S.phase === 'sea' && S.voyage) { syncSpots([], fit, 'none'); drawSea(fit.W, fit.H, t, seaOpts()); return; }
  if (S.phase === 'camp' && S.camp) { syncSpots([], fit, 'none'); if (S.camp.stop === 'atsea') drawAnchor(fit.W, fit.H, t); else drawCamp(fit.W, fit.H, t, S.camp.stop); return; }
  const spots = [], port = S.port || 'rhodes';
  (port === 'halic' ? drawHalic : drawRhodes)(fit.W, fit.H, t, { clock: 0.3, stage: S.home ? 2 : 1, spots, wants: UI.wants });
  if (S.phase === 'port' && !els.app.classList.contains('compact')) syncSpots(spots, fit, port + fit.W + 'x' + fit.H + ':' + fit.P); else syncSpots([], fit, 'none');
}
function drawTheater(t) {
  const view = els.tcanvas.parentElement, fit = fitPixels(els.tcanvas, view.clientWidth, view.clientHeight, 150);
  G = els.tcanvas.getContext('2d'); G.imageSmoothingEnabled = false;
  if (TH.mode === 'title') drawSea(fit.W, fit.H, t, { clock: 0.06, storm: 0, calm: false, row: false, crew: 6, seed: 11, scroll: t * 6, pirate: null, dolphins: 0 });
  else drawRhodes(fit.W, fit.H, t, { clock: TH.mode === 'summary' ? 0.93 : 0.3, stage: TH.mode === 'summary' ? 2 : 1, walkers: true });
}
let lastFrame = 0, uiAcc = 1, saveAcc = 0;
function frame(now) {
  const dt = lastFrame ? Math.min(0.25, (now - lastFrame) / 1000) : 0, t = now / 1000;
  lastFrame = now;
  const sheetUp = !!UI.sheet, live = S.phase === 'sea' && !S.pending && !sheetUp && els.theater.hidden;
  if (live) tick(S, dt * UI.speed * DEV.speed);
  if (S.pending && (!UI.sheet || UI.sheet.kind !== 'event')) {
    closeSheet(); openSheet('event'); Snd.event();
    if (S.pending === 'pirates') { Snd.horn(); UI.pirate = { near: 0, fight: false, leaving: false }; }
    if (S.pending === 'squall') Snd.mood('storm');
  }
  if (UI.pirate) {
    if (S.pending === 'pirates' || S.pending === 'caught') UI.pirate.near = Math.min(1, UI.pirate.near + dt * 0.9);
    else if (!UI.sheet || UI.pirate.leaving) { UI.pirate.near -= dt * 0.22; if (UI.pirate.near <= 0) UI.pirate = null; }
  }
  const stormy = S.phase === 'sea' && S.voyage && (S.voyage.wind === 'storm' || S.pending === 'squall');
  UI.storm = clamp(UI.storm + (stormy ? dt * 0.8 : -dt * 0.4), 0, 1);
  UI.dolphins = Math.max(0, UI.dolphins - dt);
  const mood = S.phase === 'port' ? 'port' : S.phase === 'camp' ? 'night' : stormy ? 'storm' : 'sea';
  if (mood !== UI.mood && Snd.ctx) { UI.mood = mood; Snd.mood(mood); }
  onPhase();
  pumpStory(now);
  if (UI.bannerT > 0) { UI.bannerT -= dt; if (UI.bannerT <= 0) els.banner.classList.remove('on'); }
  if (els.theater.hidden) drawMain(t); else drawTheater(t);
  if (UI.tab === 'hold' && els.theater.hidden) drawHold();
  uiAcc += dt;
  if (uiAcc >= 0.12) {
    uiAcc = 0;
    UI.wants = new Set(S.phase === 'port' ? merchantsAt(S.port).filter(id => wants(S, id).length || (MERCHANTS[id].bank && S.home && !S.loan.paid)) : []);
    updateHUD(); renderPanel(); updateTabs();
  }
  saveAcc += dt;
  if (saveAcc > 4) { saveAcc = 0; save(); }
  if (Snd.ctx) Snd.music(S.phase === 'port' ? 'port' : 'sea');
  requestAnimationFrame(frame);
}

// ---- boot ----
function start(data) {
  try { Snd.muted = localStorage.getItem(SOUND_KEY) === '1'; } catch (e) { /* ignore */ }
  els.coinImg.src = scaledURL(COIN, 2);
  els.meander.style.backgroundImage = `url(${scaledURL(MEANDER, 2)})`;
  for (const el of document.querySelectorAll('[data-icon]')) el.innerHTML = pxIcon(el.dataset.icon);
  els.menuBtn.innerHTML = pxIcon('menu');
  paintSound();
  const hot = data && data.state && data.state.v === VERSION && data.state.items ? data.state : null;
  S = hot || loadSaved() || newGame((Date.now() & 0x7fffffff) || 7);
  if (data && data.tab) UI.tab = data.tab;
  UI.lastWhere = phaseKey();
  if (S.log.length) els.stripText.textContent = S.log[S.log.length - 1].text;
  if (S.phase === 'summary') showSummary();
  else if (!hot) showTitle();
  renderPanel(); updateTabs(); updateHUD();
  if (window.ResizeObserver) new ResizeObserver(() => { if (HOLD.cv && HOLD.cv.isConnected) sizeHold(); }).observe(els.panel);
  requestAnimationFrame(frame);
}
const hotApi = window.claude && window.claude.hot;
if (hotApi && typeof hotApi.snapshot === 'function') { try { hotApi.snapshot(() => ({ state: S, tab: UI.tab })); } catch (e) { /* ignore */ } }
window.__emp = { state: () => S, speed: v => { DEV.speed = v; }, ui: UI, hold: HOLD, fns: { buy, sell, haggle, hire, autoPack, setSail, campAct, sleep, needsRoute, resolveEvent, repay, sailCheck, provisions, moveItem, fits, dockItems, atRisk, eta, countGood, sellPrice, merchantsAt, isCargo } };
if (hotApi && typeof hotApi.ready === 'function') hotApi.ready(start);
else start((hotApi && hotApi.data) || {});
})();
</script>
